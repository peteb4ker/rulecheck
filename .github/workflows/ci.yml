name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *' # daily drift check + main verification (06:17 UTC)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has-pipeline: ${{ steps.scan.outputs.has-pipeline }}
      has-app: ${{ steps.scan.outputs.has-app }}
      has-content: ${{ steps.scan.outputs.has-content }}
      app-relevant: ${{ steps.scan.outputs.app-relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # merge-base against the PR base branch
      - name: Scan repo state and changed paths
        id: scan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          has_pipeline=false
          [ -f pipeline/pyproject.toml ] && has_pipeline=true
          has_app=false
          compgen -G 'app/*.xcodeproj' > /dev/null && has_app=true
          has_content=false
          compgen -G 'content/*.json' > /dev/null && has_content=true

          # The macOS runner bills at 10x Linux, so the app job is gated
          # tightly: only code that can actually break the app triggers it.
          # Content changes (rewrites/, content/) can only move search
          # ranking, and the DB-level persona gates cover that on Linux in
          # the pipeline job below.
          # Scheduled runs still force it, so a path-filter gap surfaces
          # daily rather than never.
          #
          # Pushes to main never run it. We squash-merge, so the commit that
          # lands is the tree the PR just tested — re-running it on main was
          # half the entire CI bill (110 of 216 macOS minutes on 2026-07-28)
          # and never once caught something the PR had not. The residual risk
          # is a semantic conflict between two PRs merged close together;
          # the daily scheduled run is the net for that, and
          # `gh workflow run ci.yml` forces a check on demand.
          app_relevant=false
          if [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            app_relevant=true
          fi
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base=$(git merge-base "$BASE_SHA" HEAD)
            changed=$(git diff --name-only "$base" HEAD)
            printf 'changed files:\n%s\n' "$changed"
            if printf '%s\n' "$changed" | grep -qE '^(app/|pipeline/src/rulecheck_pipeline/build\.py|\.github/workflows/)'; then
              app_relevant=true
            fi
          fi

          {
            echo "has-pipeline=$has_pipeline"
            echo "has-app=$has_app"
            echo "has-content=$has_content"
            echo "app-relevant=$app_relevant"
          } >> "$GITHUB_OUTPUT"

  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: No tracked PDFs
        run: |
          tracked=$(git ls-files -- '*.pdf')
          if [ -n "$tracked" ]; then
            echo '::error::Source PDFs must never be committed (CLAUDE.md non-negotiable). Tracked:'
            printf '%s\n' "$tracked"
            exit 1
          fi
      - name: No tracked build products
        run: |
          tracked=$(git ls-files -- 'build/*' '*.db')
          if [ -n "$tracked" ]; then
            echo '::error::build/ output and .db files are build products, not source. Tracked:'
            printf '%s\n' "$tracked"
            exit 1
          fi
      - name: sources.yaml parses
        run: |
          if [ -f sources/sources.yaml ]; then
            pip install --quiet pyyaml
            python3 -c 'import yaml; yaml.safe_load(open("sources/sources.yaml"))'
            echo 'sources.yaml OK'
          else
            echo 'sources/sources.yaml not present yet; skipping'
          fi
      - name: content JSON parses
        run: |
          shopt -s nullglob
          fail=0
          for f in content/*.json; do
            if ! python3 -m json.tool "$f" > /dev/null; then
              echo "::error file=$f::invalid JSON"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] && echo 'content JSON OK (or none present)'
          exit "$fail"
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7 "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" -color

  pipeline:
    needs: detect
    if: needs.detect.outputs.has-pipeline == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - name: Install (locked)
        run: uv sync --locked --all-extras
      # Build first: the persona acceptance tests skip themselves without a
      # database, so building before pytest is what makes them run in CI.
      # This is where content correctness is enforced — cheaply, on Linux.
      - name: Build and verify committed content
        if: needs.detect.outputs.has-content == 'true'
        run: |
          uv run python -m rulecheck_pipeline build --root ..
          uv run python -m rulecheck_pipeline verify --root ..
      - name: Unit tests (incl. persona gates against the built database)
        run: uv run pytest -v

  app:
    needs: detect
    if: needs.detect.outputs.has-app == 'true' && needs.detect.outputs.app-relevant == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - name: Build rules DB for app bundle
        run: |
          cd pipeline && uv sync --locked --all-extras
          uv run python -m rulecheck_pipeline build --root ..
          uv run python -m rulecheck_pipeline verify --root ..
          mkdir -p ../app/RuleCheck/Resources
          cp ../build/rulecheck.db ../app/RuleCheck/Resources/rulecheck.db
      - name: Discover project and scheme
        id: xcode
        run: |
          shopt -s nullglob
          projects=(app/*.xcodeproj)
          if [ "${#projects[@]}" -ne 1 ]; then
            echo "::error::expected exactly one .xcodeproj under app/, found ${#projects[@]}"
            exit 1
          fi
          project="${projects[0]}"
          scheme=$(xcodebuild -list -project "$project" -json \
            | python3 -c 'import json,sys; s=json.load(sys.stdin)["project"]["schemes"]; print(s[0] if s else "")')
          if [ -z "$scheme" ]; then
            echo "::error::no shared schemes in $project — share the RuleCheck scheme in Xcode"
            exit 1
          fi
          echo "project=$project" >> "$GITHUB_OUTPUT"
          echo "scheme=$scheme" >> "$GITHUB_OUTPUT"
      - name: Unit and UI tests
        run: |
          xcodebuild test \
            -project '${{ steps.xcode.outputs.project }}' \
            -scheme '${{ steps.xcode.outputs.scheme }}' \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO
