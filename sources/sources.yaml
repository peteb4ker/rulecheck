  heading_rules:
  - ^((Appendix \d+:(?!.*\.{2,}).*|Become\ a\ Pokémon\ Master!|Pokémon\ TCG\ Basic\ Concepts|Playing\
    the\ Game|Play!\ Pokémon\ Stores\ and\ League\ Battle\ Decks|Advanced\ Rules|Deck\ Building|Glossary|Credits))$
  - ^((How\ to\ Win|Energy\ Types|Parts\ of\ a\ Pokémon\ Card|3\ Card\ Types|Zones\ of\ the\ Pokémon\
