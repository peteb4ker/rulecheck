name: RuleCheck
options:
  # Reverse-DNS of rulecheck.app. Deliberately not a Skyetrail
  # namespace: this is not a Skyetrail app. Bundle IDs are permanent
  # once submitted to the App Store, so this was settled before the
  # first submission rather than after.
  bundleIdPrefix: app.rulecheck
  deploymentTarget:
    iOS: "17.0"
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    majorVersion: 7.0.0
targets:
  RuleCheck:
    type: application
    platform: iOS
    sources:
      - path: RuleCheck
    resources:
      - path: RuleCheck/Resources
        optional: true
    dependencies:
      - package: GRDB
        product: GRDB
    # Launch screen is a solid `canvas` token so launch -> search feels
    # continuous in both temperatures (Info.plist merges with the
    # generated one; the file's UILaunchScreen wins).
    info:
      path: RuleCheck/Info.plist
      properties:
        # No network code, no CryptoKit, no CommonCrypto — nothing to declare.
        # Without this key App Store Connect asks the export-compliance
        # question on every upload and holds the build until it is answered.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: canvas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.rulecheck.RuleCheck
        # Signing team lives here so `just app-gen` stops wiping it on every
        # regeneration. Team IDs are not secret (they ship in app metadata).
        DEVELOPMENT_TEAM: T27ZNJQMWN
        CODE_SIGN_STYLE: Automatic
        # Two words on purpose: "RuleCheck" (one word) is a live, unrelated
        # App Store app (id6786960142). This key drives every user-visible
        # surface — home screen, app switcher, Settings.
        #
        # CFBundleName stays "RuleCheck": Xcode synthesizes it from
        # PRODUCT_NAME under GENERATE_INFOPLIST_FILE and ignores
        # INFOPLIST_KEY_CFBundleName (verified). Forcing it would mean a
        # "Rule Check.app" product and spaces through TEST_HOST, justfile,
        # and CI — not worth it for a key CFBundleDisplayName overrides.
        INFOPLIST_KEY_CFBundleDisplayName: "Rule Check"
        GENERATE_INFOPLIST_FILE: YES
        # Under GENERATE_INFOPLIST_FILE, Xcode synthesizes the version keys
        # from these settings and DROPS whatever Info.plist says. Without
        # them the built app carries no CFBundleShortVersionString or
        # CFBundleVersion at all, and App Store Connect rejects the upload.
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.10"
  RuleCheckTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RuleCheckTests]
    dependencies:
      - target: RuleCheck
    settings:
      base:
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/RuleCheck.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/RuleCheck
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES
        # Under GENERATE_INFOPLIST_FILE, Xcode synthesizes the version keys
        # from these settings and DROPS whatever Info.plist says. Without
        # them the built app carries no CFBundleShortVersionString or
        # CFBundleVersion at all, and App Store Connect rejects the upload.
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  RuleCheckUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [RuleCheckUITests]
    dependencies:
      - target: RuleCheck
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # Under GENERATE_INFOPLIST_FILE, Xcode synthesizes the version keys
        # from these settings and DROPS whatever Info.plist says. Without
        # them the built app carries no CFBundleShortVersionString or
        # CFBundleVersion at all, and App Store Connect rejects the upload.
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
schemes:
  RuleCheck:
    build:
      targets:
        RuleCheck: all
        RuleCheckTests: [test]
        RuleCheckUITests: [test]
    test:
      targets: [RuleCheckTests, RuleCheckUITests]
