    details\ of\ taking\ a\ mulligan|What\ counts\ as\ an\ attack\?|Full\ details\ of\ attacking|What’s\
    the\ difference\ between\ “up\ to”\ and\ “any\ amount”\?|What\ if\ you\ should\ draw\ more\ cards\
    than\ you\ have\?|What\ if\ both\ players\ win\ at\ the\ same\ time\?|What’s\ a\ tiebreaker\ game\?|What\
    does\ and\ doesn’t\ count\ for\ a\ Pokémon’s\ name\?|Special\ rules\ for\ Pokémon\-GX|Special\ rules\
    for\ Pokémon\ BREAK|Special\ rules\ for\ Pokémon\-EX|Special\ rules\ for\ Mega\ Evolution\ Pokémon\-EX|Key\
    Restored\ Pokémon\ Notes))$
