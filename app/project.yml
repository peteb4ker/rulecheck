name: Benchside
options:
  bundleIdPrefix: com.skyetrail
  deploymentTarget:
    iOS: "17.0"
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    majorVersion: 7.0.0
targets:
  Benchside:
    type: application
    platform: iOS
    sources:
      - path: Benchside
    resources:
      - path: Benchside/Resources
        optional: true
    dependencies:
      - package: GRDB
        product: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skyetrail.benchwise
        INFOPLIST_KEY_CFBundleDisplayName: Benchwise
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "5.10"
  BenchsideTests:
    type: bundle.unit-test
    platform: iOS
    sources: [BenchsideTests]
    dependencies:
      - target: Benchside
    settings:
      base:
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Benchside.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Benchside
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES
  BenchsideUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [BenchsideUITests]
    dependencies:
      - target: Benchside
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Benchside:
    build:
      targets:
        Benchside: all
        BenchsideTests: [test]
        BenchsideUITests: [test]
    test:
      targets: [BenchsideTests, BenchsideUITests]
